<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Voice 🤖</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, #24345f, #0b1020 55%, #05070d);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 650px;
      background: rgba(17, 24, 45, 0.94);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 25px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .top {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .logo {
      font-size: 42px;
    }

    .top h1 {
      font-size: 22px;
      margin-top: 5px;
    }

    .status {
      color: #64ffb0;
      font-size: 13px;
      margin-top: 5px;
    }

    .chat {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .message {
      max-width: 85%;
      padding: 13px 15px;
      margin-bottom: 15px;
      border-radius: 17px;
      line-height: 1.45;
      animation: appear 0.3s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .ai {
      background: #202c4d;
      border-bottom-left-radius: 5px;
    }

    .user {
      background: #5865f2;
      margin-left: auto;
      border-bottom-right-radius: 5px;
    }

    .label {
      font-size: 11px;
      opacity: 0.6;
      margin-bottom: 5px;
    }

    .mic-area {
      padding: 25px;
      text-align: center;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .mic-button {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #5865f2, #8b5cf6);
      color: white;
      font-size: 34px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(88,101,242,0.4);
      transition: 0.2s;
    }

    .mic-button:hover {
      transform: scale(1.05);
    }

    .mic-button.recording {
      background: #ef4444;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%,100% {
        box-shadow: 0 0 0 0 rgba(239,68,68,0.5);
      }
      50% {
        box-shadow: 0 0 0 18px rgba(239,68,68,0);
      }
    }

    .instruction {
      margin-top: 12px;
      font-size: 13px;
      color: #aab4d0;
    }

    .typing {
      display: inline-flex;
      gap: 4px;
    }

    .typing span {
      width: 6px;
      height: 6px;
      background: #9ba8c9;
      border-radius: 50%;
      animation: typing 1s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes typing {
      0%, 60%, 100% {
        transform: translateY(0);
      }
      30% {
        transform: translateY(-5px);
      }
    }

    .error {
      color: #ff8f8f;
      font-size: 13px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="top">
      <div class="logo">🤖</div>
      <h1>AI Voice Assistant</h1>
      <div class="status">● Online</div>
    </div>

    <div class="chat" id="chat">

      <div class="message ai">
        <div class="label">AI</div>
        Hello! 👋 Press the microphone and talk to me.
      </div>

    </div>

    <div class="mic-area">

      <button class="mic-button" id="micButton" onclick="startListening()">
        🎙️
      </button>

      <div class="instruction" id="instruction">
        Tap the microphone to speak
      </div>

      <div class="error" id="error"></div>

    </div>

  </div>

  <script>

    const chat = document.getElementById("chat");
    const micButton = document.getElementById("micButton");
    const instruction = document.getElementById("instruction");
    const errorBox = document.getElementById("error");

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    let recognition;

    function addMessage(text, type) {

      const message = document.createElement("div");

      message.className = "message " + type;

      const label = document.createElement("div");

      label.className = "label";
      label.textContent = type === "ai" ? "AI" : "YOU";

      const content = document.createElement("div");

      content.textContent = text;

      message.appendChild(label);
      message.appendChild(content);

      chat.appendChild(message);

      chat.scrollTop = chat.scrollHeight;
    }

    function addTyping() {

      const message = document.createElement("div");

      message.className = "message ai";
      message.id = "typing";

      message.innerHTML = `
        <div class="label">AI</div>
        <div class="typing">
          <span></span>
          <span></span>
          <span></span>
        </div>
      `;

      chat.appendChild(message);

      chat.scrollTop = chat.scrollHeight;
    }

    function removeTyping() {

      const typing = document.getElementById("typing");

      if (typing) {
        typing.remove();
      }
    }

    function speak(text) {

      if (!("speechSynthesis" in window)) {
        return;
      }

      window.speechSynthesis.cancel();

      const voice = new SpeechSynthesisUtterance(text);

      voice.lang = "fil-PH";
      voice.rate = 0.9;
      voice.pitch = 1.1;

      window.speechSynthesis.speak(voice);
    }

    function startListening() {

      errorBox.textContent = "";

      if (!SpeechRecognition) {

        errorBox.textContent =
          "Hindi supported ng browser na ito ang voice recognition. Try Chrome.";

        return;
      }

      recognition = new SpeechRecognition();

      recognition.lang = "fil-PH";
      recognition.continuous = false;
      recognition.interimResults = false;

      micButton.classList.add("recording");

      micButton.textContent = "🔴";

      instruction.textContent = "Nakikinig ako... magsalita ka 🎙️";

      recognition.start();

      recognition.onresult = function(event) {

        const text =
          event.results[0][0].transcript.trim();

        micButton.classList.remove("recording");

        micButton.textContent = "🎙️";

        instruction.textContent =
          "Tap the microphone to speak";

        if (!text) return;

        addMessage(text, "user");

        addTyping();

        setTimeout(function() {

          removeTyping();

          const response =
            "HAHAHAHA 😂 " +
            text +
            " 😭 HAHAHA! Narinig ko talaga 'yan!";

          addMessage(response, "ai");

          speak(response);

        }, 1000);

      };

      recognition.onerror = function(event) {

        micButton.classList.remove("recording");

        micButton.textContent = "🎙️";

        instruction.textContent =
          "Tap the microphone to speak";

        if (event.error === "not-allowed") {

          errorBox.textContent =
            "I-allow ang microphone permission para gumana.";

        } else {

          errorBox.textContent =
            "Hindi ko narinig. Subukan ulit.";

        }
      };

      recognition.onend = function() {

        micButton.classList.remove("recording");

        micButton.textContent = "🎙️";

        instruction.textContent =
          "Tap the microphone to speak";

      };

    }

  </script>

</body>
</html>
